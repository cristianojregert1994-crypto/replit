<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerar Ícones - LoveBoltReplit GPT Connector</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0f0f12;
      color: #e8e8ed;
      padding: 40px;
      text-align: center;
    }
    h1 { color: #7c3aed; }
    canvas { border: 1px solid #333; margin: 10px; }
    a { color: #a78bfa; display: block; margin: 8px; }
    .info { color: #8b8b9e; margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🎨 Gerador de Ícones</h1>
  <p>Clique em cada link para baixar o ícone</p>
  
  <div>
    <canvas id="c16" width="16" height="16"></canvas>
    <a id="dl16" download="icon16.png">Baixar icon16.png</a>
  </div>
  <div>
    <canvas id="c48" width="48" height="48"></canvas>
    <a id="dl48" download="icon48.png">Baixar icon48.png</a>
  </div>
  <div>
    <canvas id="c128" width="128" height="128"></canvas>
    <a id="dl128" download="icon128.png">Baixar icon128.png</a>
  </div>
  
  <p class="info">Salve os PNGs na pasta <code>icons/</code> da extensão</p>

  <script>
    function drawIcon(canvasId) {
      const c = document.getElementById(canvasId);
      const size = c.width;
      const ctx = c.getContext('2d');
      
      // Rounded rect background
      const r = size * 0.18;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      
      // Gradient
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#7c3aed');
      grad.addColorStop(1, '#a78bfa');
      ctx.fillStyle = grad;
      ctx.fill();
      
      // Text
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.38}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('LG', size / 2, size / 2);
      
      return c.toDataURL('image/png');
    }
    
    // Generate and set download links
    const icons = [
      { canvas: 'c16', link: 'dl16' },
      { canvas: 'c48', link: 'dl48' },
      { canvas: 'c128', link: 'dl128' },
    ];
    
    icons.forEach(({ canvas, link }) => {
      const dataUrl = drawIcon(canvas);
      document.getElementById(link).href = dataUrl;
    });
  </script>
</body>
</html>
